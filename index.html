<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS for parsing .xls / .xlsx files in the browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-8 min-h-screen font-sans">
  <div class="max-w-6xl mx-auto">
    <h1 class="text-3xl font-bold mb-6 text-indigo-600">Statement Tracker</h1>
    
    <!-- Upload Section -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6">
      <label class="block text-sm font-semibold text-slate-700 mb-2">Upload Bank Statement</label>
      <input type="file" id="fileUpload" accept=".xls,.xlsx,.csv" 
             class="block w-full border border-slate-300 rounded-lg shadow-sm p-2 text-sm cursor-pointer file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" />
    </div>

    <!-- Data Table Section -->
    <div id="tableContainer" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-200 overflow-x-auto">
      <table class="min-w-full divide-y divide-slate-200 mb-6">
        <thead class="bg-slate-50">
          <tr>
            <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase">Date</th>
            <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase w-1/3">Narration</th>
            <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase">Withdrawal</th>
            <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase">Deposit</th>
            <th class="px-4 py-3 text-left text-xs font-semibold text-slate-500 uppercase w-1/4">Short Description</th>
          </tr>
        </thead>
        <tbody id="dataTableBody" class="bg-white divide-y divide-slate-200">
          <!-- Parsed rows injected here via JS -->
        </tbody>
      </table>
      
      <!-- Progress Bar (Hidden by default) -->
      <div id="progressContainer" class="hidden mb-4">
        <div class="flex justify-between mb-1">
          <span class="text-sm font-medium text-indigo-700">Saving to Google Sheets...</span>
          <span id="progressText" class="text-sm font-medium text-indigo-700">0%</span>
        </div>
        <div class="w-full bg-slate-200 rounded-full h-2.5">
          <div id="progressBar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>

      <button id="saveBtn" class="bg-indigo-600 text-white font-medium px-6 py-2.5 rounded-lg shadow hover:bg-indigo-700 transition w-full sm:w-auto">
        Save Processed Data to Sheet
      </button>
    </div>
  </div>

  <!-- Hidden datalist for the autofill dropdown -->
  <datalist id="descriptionList"></datalist>

  <script>
    let knownMappings = {};
    let parsedData = [];

    // 1. Fetch historical mappings
    window.onload = function() {
      google.script.run.withSuccessHandler(function(response) {
        knownMappings = response.mappings;
        const dataList = document.getElementById('descriptionList');
        response.descriptions.forEach(desc => {
          const option = document.createElement('option');
          option.value = desc;
          dataList.appendChild(option);
        });
      }).getMappings();
    };

    // 2. Parse the uploaded Excel file
    document.getElementById('fileUpload').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, {type: 'array'});
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const json = XLSX.utils.sheet_to_json(firstSheet, {defval: ""});
        processBankData(json);
      };
      reader.readAsArrayBuffer(file);
    });

    // 3. Render the table
    function processBankData(json) {
      const tbody = document.getElementById('dataTableBody');
      tbody.innerHTML = '';
      parsedData = [];

      json.forEach((row, index) => {
        const date = row['Date'] || row['Transaction Date'] || row['Value Dt'] || '';
        const narration = row['Narration'] || row['Description'] || row['Particulars'] || '';
        const withdrawal = row['Withdrawal Amt.'] || row['Debit'] || '';
        const deposit = row['Deposit Amt.'] || row['Credit'] || '';

        if (!date || !narration) return;

        const autoDesc = knownMappings[narration] || '';
        parsedData.push({ date, narration, withdrawal, deposit });

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="px-4 py-3 text-sm text-slate-900 whitespace-nowrap">${date}</td>
          <td class="px-4 py-3 text-sm text-slate-600 truncate max-w-xs" title="${narration}">${narration}</td>
          <td class="px-4 py-3 text-sm text-red-600 font-medium">${withdrawal}</td>
          <td class="px-4 py-3 text-sm text-emerald-600 font-medium">${deposit}</td>
          <td class="px-4 py-3">
            <input type="text" id="desc_${index}" value="${autoDesc}" list="descriptionList" 
                   class="border border-slate-300 rounded-md p-2 w-full text-sm focus:ring-indigo-500 focus:border-indigo-500 outline-none" 
                   placeholder="E.g., Fuel, Groceries, Equipment">
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('tableContainer').classList.remove('hidden');
    }

    // Helper function to wrap google.script.run in a Promise
    function saveChunk(chunk) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)
          .saveData(chunk);
      });
    }

    // 4. Chunk data and save with progress updates
    document.getElementById('saveBtn').addEventListener('click', async function() {
      const btn = this;
      const progressContainer = document.getElementById('progressContainer');
      const progressBar = document.getElementById('progressBar');
      const progressText = document.getElementById('progressText');

      // Prepare UI for saving
      btn.innerText = 'Saving Data...';
      btn.disabled = true;
      progressContainer.classList.remove('hidden');
      progressBar.style.width = '0%';
      progressText.innerText = '0%';

      // Build the final array to save
      const rowsToSave = parsedData.map((data, index) => {
        const finalDesc = document.getElementById(`desc_${index}`).value.trim();
        return [data.date, data.narration, data.withdrawal, data.deposit, finalDesc];
      });

      const CHUNK_SIZE = 50; // Send 50 rows at a time
      const totalRows = rowsToSave.length;
      let rowsProcessed = 0;

      try {
        // Loop through chunks sequentially
        for (let i = 0; i < totalRows; i += CHUNK_SIZE) {
          const chunk = rowsToSave.slice(i, i + CHUNK_SIZE);
          
          await saveChunk(chunk); // Wait for this batch to save
          
          // Update progress math
          rowsProcessed += chunk.length;
          const percentage = Math.round((rowsProcessed / totalRows) * 100);
          
          // Update UI
          progressBar.style.width = percentage + '%';
          progressText.innerText = percentage + '%';
        }

        // Success state
        btn.innerText = 'Saved Successfully!';
        btn.classList.replace('bg-indigo-600', 'bg-emerald-600');
        
        // Reset state after 3 seconds
        setTimeout(() => {
           btn.innerText = 'Save Processed Data to Sheet';
           btn.classList.replace('bg-emerald-600', 'bg-indigo-600');
           btn.disabled = false;
           progressContainer.classList.add('hidden');
        }, 3000);

      } catch (error) {
         console.error(error);
         btn.innerText = 'Error Saving! Try again.';
         btn.classList.replace('bg-indigo-600', 'bg-red-600');
         btn.disabled = false;
      }
    });
  </script>
</body>
</html>
