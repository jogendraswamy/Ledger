<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-2xl p-6">
        <h2 class="text-2xl font-bold mb-4 text-gray-800">Log Cash Transaction</h2>
        <form id="cashForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Type</label>
                <select id="type" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                    <option value="CASH DEBIT (Expense)">Expense (Out)</option>
                    <option value="CASH CREDIT (Income)">Income (In)</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700">Amount (₹)</label>
                <input type="number" id="amount" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Business Entity</label>
                <select id="entity" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                    <option>Supermarket</option>
                    <option>Agricultural Operations</option>
                    <option>Mayuri Constructions</option>
                    <option>Personal & Holding</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Narration / Vendor Name</label>
                <input type="text" id="narration" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg font-semibold hover:bg-blue-700">Submit to Ledger</button>
        </form>
        <p id="status" class="mt-4 text-center font-medium text-green-600 hidden">Transaction Saved!</p>
    </div>

    <script>
        document.getElementById('cashForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = this.querySelector('button');
            submitBtn.innerText = 'Saving...';
            submitBtn.disabled = true;

            const payload = {
                date: new Date().toLocaleDateString('en-GB'),
                amount: document.getElementById('amount').value,
                type: document.getElementById('type').value,
                entity: document.getElementById('entity').value,
                narration: document.getElementById('narration').value,
                category: 'Manual Cash'
            };

            // Replace this with your Google Apps Script Web App URL
            const url = 'https://script.google.com/macros/s/AKfycbz3yfV4alYc0kEO4QsbKfeXYn2F6I2T4h6zRJen8sQDtz9HtrX2aWRTraCOaLJ7-DdeDQ/exec'; 

            fetch(url, {
                method: 'POST',
                body: JSON.stringify(payload)
            }).then(response => {
                document.getElementById('cashForm').reset();
                document.getElementById('status').classList.remove('hidden');
                submitBtn.innerText = 'Submit to Ledger';
                submitBtn.disabled = false;
                setTimeout(() => document.getElementById('status').classList.add('hidden'), 3000);
            }).catch(error => {
                alert('Error saving data');
                submitBtn.innerText = 'Submit to Ledger';
                submitBtn.disabled = false;
            });
        });
    </script>
</body>
</html>
